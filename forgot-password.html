<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Forgot Password - Niks Inventory">
  <title>Forgot Password | Niks Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth-page="forgot">
  <div class="loading-overlay" id="page-loader"><div class="spinner"></div></div>

  <div class="auth-page">
    <div class="auth-container" style="max-width:480px;grid-template-columns:1fr">
      <div class="auth-form-panel" style="padding:3rem">
        <div style="text-align:center;margin-bottom:1.5rem">
          <div class="logo" style="margin:0 auto 1rem;width:56px;height:56px;font-size:1.5rem;border-radius:12px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center">🔐</div>
          <h2>Reset password</h2>
          <p>Enter your email and we'll send you a reset link</p>
        </div>
        <div class="auth-error" id="forgot-error"></div>
        <div class="auth-success" id="forgot-success"></div>
        <form class="auth-form" id="forgot-form">
          <div class="form-group floating-label">
            <input type="email" class="form-control" id="forgot-email" placeholder=" " required>
            <label for="forgot-email">Email address</label>
          </div>
          <button type="submit" class="btn btn-primary auth-submit">Send Reset Link</button>
        </form>
        <div class="auth-footer" style="margin-top:1.5rem">
          <a href="login.html">← Back to login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
