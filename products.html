<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product Management - Niks Inventory">
  <title>Products | Niks Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    #view-grid.active, #view-list.active { background: var(--primary); border-color: var(--primary); color: white; }
    #bulk-bar { display: none; padding: 0.75rem 1rem; background: rgba(124,58,237,0.15); border-radius: 12px; margin-bottom: 1rem; align-items: center; gap: 1rem; }
    .filter-bar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; }
    .filter-bar .form-control { width: auto; min-width: 160px; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="page-loader"><div class="spinner"></div></div>
  <div id="app-layout" class="app-layout"></div>

  <div id="page-content-source" style="display:none">
    <div class="flex-between reveal page-header-actions">
      <div>
        <h1 class="page-title">Product Management</h1>
        <p class="page-subtitle"><span id="product-count">0 products</span></p>
      </div>
      <button class="btn btn-primary" id="add-product-btn">➕ Add Product</button>
    </div>

    <div id="bulk-bar" class="reveal">
      <span><strong id="bulk-count">0</strong> selected</span>
      <button class="btn btn-sm btn-danger" id="bulk-delete">Delete Selected</button>
    </div>

    <div class="filter-bar glass-card reveal" style="padding:1rem">
      <input type="search" class="form-control" id="search-products" placeholder="Search products, SKU..." style="flex:1;min-width:200px">
      <select class="form-control" id="filter-category"><option value="">All Categories</option></select>
      <select class="form-control" id="filter-status">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="low_stock">Low Stock</option>
        <option value="out_of_stock">Out of Stock</option>
      </select>
      <div class="flex-center view-toggle">
        <button class="btn btn-sm btn-secondary active" id="view-grid">Grid</button>
        <button class="btn btn-sm btn-secondary" id="view-list">List</button>
      </div>
    </div>

    <div id="products-container"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Product</h2>
        <button class="btn btn-icon btn-secondary" data-close-modal>×</button>
      </div>
      <form id="product-form">
        <div class="modal-body">
          <input type="hidden" id="product-id">
          <div class="form-group"><label>Product Name</label><input class="form-control" id="product-name" required></div>
          <div class="grid-2">
            <div class="form-group">
              <label>SKU</label>
              <div class="flex-center" style="gap:0.5rem">
                <input class="form-control" id="product-sku" required>
                <button type="button" class="btn btn-sm btn-secondary" id="generate-sku">Generate</button>
              </div>
            </div>
            <div class="form-group"><label>Category</label><select class="form-control" id="product-category" required></select></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Price ($)</label><input type="number" step="0.01" class="form-control" id="product-price" required></div>
            <div class="form-group"><label>Quantity</label><input type="number" class="form-control" id="product-quantity" required></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Supplier</label><select class="form-control" id="product-supplier"></select></div>
            <div class="form-group"><label>Low Stock Alert</label><input type="number" class="form-control" id="product-lowstock" value="15"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Barcode Modal -->
  <div class="modal-overlay" id="barcode-modal">
    <div class="modal" style="max-width:400px">
      <div class="modal-header"><h2>Barcode & QR</h2><button class="btn btn-icon btn-secondary" data-close-modal>×</button></div>
      <div class="modal-body" style="text-align:center">
        <p id="barcode-sku" style="font-weight:600;margin-bottom:1rem"></p>
        <div class="barcode-display" id="barcode-bars" style="margin-bottom:1rem"></div>
        <div class="qr-placeholder" title="QR Code"></div>
        <p class="text-muted" style="margin-top:1rem;font-size:0.85rem">Scan with barcode scanner</p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
