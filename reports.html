<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sales & Reports - Niks Inventory">
  <title>Sales & Reports | Niks Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="loading-overlay" id="page-loader"><div class="spinner"></div></div>
  <div id="app-layout" class="app-layout"></div>

  <div id="page-content-source" style="display:none">
    <div class="flex-between reveal page-header-actions">
      <div>
        <h1 class="page-title">Sales & Reports</h1>
        <p class="page-subtitle">Analytics, revenue charts, and performance insights</p>
      </div>
      <div class="flex-center" style="gap:0.75rem">
        <select class="form-control" id="report-period" style="width:auto">
          <option value="month">This Month</option>
          <option value="week">This Week</option>
          <option value="quarter">This Quarter</option>
          <option value="year">This Year</option>
        </select>
        <button class="btn btn-primary" id="export-report">📥 Export Report</button>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:1.5rem">
      <div class="glass-card reveal">
        <h2 style="margin-bottom:1rem">Revenue Growth</h2>
        <div class="chart-container"><canvas id="report-revenue-chart"></canvas></div>
      </div>
      <div class="glass-card reveal">
        <h2 style="margin-bottom:1rem">Category Distribution</h2>
        <div class="chart-container" style="display:flex;align-items:center;justify-content:center">
          <canvas id="report-category-chart"></canvas>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="glass-card reveal">
        <h2 style="margin-bottom:1rem">Product Performance</h2>
        <div class="chart-container"><canvas id="report-performance-chart"></canvas></div>
      </div>
      <div class="glass-card reveal">
        <h2 style="margin-bottom:1rem">Top Selling Items</h2>
        <div id="top-products-list"></div>
      </div>
    </div>

    <div class="glass-card reveal" style="margin-top:1.5rem">
      <div class="flex-between" style="margin-bottom:1rem">
        <h2>Sales Report</h2>
        <div class="flex-center filter-bar" style="gap:0.5rem;margin:0">
          <input type="date" class="form-control" id="date-from" style="width:auto">
          <span class="text-muted">to</span>
          <input type="date" class="form-control" id="date-to" style="width:auto">
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="sales-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
