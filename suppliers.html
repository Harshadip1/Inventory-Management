<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Supplier Management - Niks Inventory">
  <title>Suppliers | Niks Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>#suppliers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.25rem;margin-bottom:1.5rem}</style>
</head>
<body>
  <div class="loading-overlay" id="page-loader"><div class="spinner"></div></div>
  <div id="app-layout" class="app-layout"></div>

  <div id="page-content-source" style="display:none">
    <div class="flex-between reveal page-header-actions">
      <div>
        <h1 class="page-title">Supplier Management</h1>
        <p class="page-subtitle">Manage suppliers, contacts, and purchase history</p>
      </div>
      <button class="btn btn-primary" id="add-supplier-btn">➕ Add Supplier</button>
    </div>

    <div class="flex-between glass-card reveal" style="padding:1rem;margin-bottom:1.5rem">
      <input type="search" class="form-control" id="supplier-search" placeholder="Search suppliers..." style="flex:1;max-width:400px">
      <select class="form-control" id="supplier-status-filter" style="width:auto">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <div id="suppliers-grid"></div>

    <div class="glass-card reveal">
      <h2 style="margin-bottom:1rem">Purchase History</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>PO ID</th><th>Supplier</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="purchase-history-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="supplier-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="supplier-modal-title">Add Supplier</h2>
        <button class="btn btn-icon btn-secondary" data-close-modal>×</button>
      </div>
      <form id="supplier-form">
        <div class="modal-body">
          <input type="hidden" id="supplier-id">
          <div class="form-group"><label>Company Name</label><input class="form-control" id="supplier-name" required></div>
          <div class="grid-2">
            <div class="form-group"><label>Email</label><input type="email" class="form-control" id="supplier-email" required></div>
            <div class="form-group"><label>Phone</label><input class="form-control" id="supplier-phone" required></div>
          </div>
          <div class="form-group"><label>Address</label><input class="form-control" id="supplier-address" required></div>
          <div class="form-group">
            <label>Status</label>
            <select class="form-control" id="supplier-status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/suppliers.js"></script>
</body>
</html>
